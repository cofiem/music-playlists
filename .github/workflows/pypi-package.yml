---
name: Build package and upload to test PyPI and PyPI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-package:
    name: Build package
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and Inspect Python
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: 'true'

  # Upload to Test PyPI on every commit on main.
  release-test-pypi:
    name: Upload release to test.pypi.org
    runs-on: ubuntu-24.04
    needs: build-package
    environment:
      name: release-test-pypi
      url: https://test.pypi.org/project/music-playlists
    if: github.repository_owner == 'cofiem' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      # "id-token: write" is needed for PyPI Trusted Publishing
      id-token: write

    steps:
      - name: Download packages built by build-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

  # Upload to real PyPI on GitHub Releases.
  release-pypi:
    name: Upload release to pypi.org
    runs-on: ubuntu-24.04
    needs: build-package
    environment:
      name: release-pypi
      url: https://pypi.org/project/music-playlists
    if: github.repository_owner == 'cofiem' && github.event.action == 'published' && startsWith(github.ref, 'refs/tags')

    permissions:
      # "id-token: write" is needed for PyPI Trusted Publishing
      id-token: write

    steps:
      - name: Download packages built by build-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          print-hash: true
          verbose: true
